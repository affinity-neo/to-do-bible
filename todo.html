const IME=e=>e.isComposing||e.keyCode===229;
function startAdd(cid){S.add=cid;S.edit=null;render()}
function addKey(e,cid){if(IME(e))return;if(e.key==='Escape'){S.add=null;render();return}if(e.key!=='Enter')return;
 const v=e.target.value.trim();if(!v){S.add=null;render();return}
 D.todos.push({id:uid(),cid,text:v,time:'',date:S.date,done:0,memo:'',ts:Date.now()});save();e.target.value='';render()}
const addBlur=()=>setTimeout(()=>{if(S.add&&document.activeElement?.id!=='ai'){S.add=null;render()}},150);
function editKey(e,id){if(IME(e))return;if(e.key==='Escape'){S.edit=null;render();return}if(e.key!=='Enter')return;commitEdit(id,e.target.value)}
const blurEdit=(id,v)=>setTimeout(()=>{if(S.edit===id&&document.activeElement?.id!=='ei')commitEdit(id,v)},150);
function commitEdit(id,v){if(S.edit!==id)return;v=v.trim();const t=T(id);S.edit=null;if(t&&v){t.text=v;save()}render()}
function scoreCategory(t){const c=D.cats.find(x=>x.id===t.cid);const n=c?String(c.name).trim():'';return n==='Neo'||n==='일정'}
function deleteTask(id){const t=T(id);if(!t)return;if(t.done&&t.coined&&scoreCategory(t))D.coins=Math.max(0,D.coins-1);D.todos=D.todos.filter(x=>x.id!==id);save();mclose();render()}
function toggle(id){const t=T(id);if(!t)return;const wasDone=!!t.done;t.done=wasDone?0:1;let g=0;
 if(scoreCategory(t)){
  if(t.done){if(!t.coined){t.coined=1;g+=1}}
  else if(t.coined){g-=1;t.coined=0}
  const day=D.todos.filter(x=>x.date===t.date&&!x.arch&&scoreCategory(x));
  if(day.length>0&&day.every(x=>x.done)&&!D.bonus[t.date]){D.bonus[t.date]=1;D.completeCoins=(D.completeCoins||0)+1;toast('완료 코인 +1')}
  else if(D.bonus[t.date]&&(!day.length||!day.every(x=>x.done))){D.bonus[t.date]=0;D.completeCoins=Math.max(0,(D.completeCoins||0)-1);toast('완료 코인 -1')}
 }else{t.coined=0}
 if(t.done&&scoreCategory(t)&&D.activePet&&!t.petXpEarned){t.petXpEarned=1;D.petXp=(D.petXp||0)+1;const before=Math.floor(((D.petXp||0)-1)/5)+1,after=Math.floor((D.petXp||0)/5)+1;if(after>before)toast('집중 파트너 레벨 업! 경험치 '+(D.petXp||0));else toast('집중 파트너 경험치 +1')}
 if(t.done&&!D.cats.find(c=>c.id===t.cid)?.priv){D.log.unshift({text:t.text,ts:Date.now()});D.log.length=Math.min(D.log.length,50)}
 if(g){D.coins=Math.max(0,D.coins+g);toast(g>0?'코인 +'+g:'코인 '+g)}save();render()}

 if(v==='main'){const rows=[['#d9a521','note','메모',t.memo?esc(t.memo.slice(0,18)):'','memo'],['#d0608f','clock','시간 알림',t.time||'','time'],['#d0608f','clock','타이머 열기','','timer'],['#5b63d6','repeat','반복하기 · 루틴 등록하기','매일/매주/매달 설정','routine'],['#5b63d6','arr','내일 하기','',''],['#5b63d6','turn','날짜 바꾸기',t.date,'date'],['#5b63d6','box','보관함으로 이동','',''],['#1d1e21','info','정보 보기','','about']];
  body=`<div class="big"><button onclick="S.edit='${id}';S.add=null;mclose();render()"><span style="color:#4a6cf7">${ic('pen','width:22px;height:22px')}</span>수정하기</button><button onclick="deleteTask('${id}')"><span style="color:#e0476b">${ic('tr','width:22px;height:22px')}</span>삭제하기</button></div>`+rows.map(([c,i,l,s,f],k)=>`<button class="sr" onclick="${f==='routine'?`mclose();routineForm({name:T('${id}').text,cid:T('${id}').cid,memo:T('${id}').memo||'',time:T('${id}').time||''})`:f?`sheet('${id}','${f}')`:k===4?`tomorrow('${id}')`:`archive('${id}')`}"><i style="background:${c}">${ic(i)}</i><span style="flex:1">${l}</span><span class="mu" style="font-size:12px">${s}</span></button>`).join('')}
 else if(v==='memo'){title='메모';body=`<textarea id="sm" placeholder="메모를 입력하세요">${esc(t.memo)}</textarea><button class="btn wide" onclick="svMemo('${id}')">저장</button>`}
 else if(v==='time'){title='시간 알림';body=`<input id="st" type="time" value="${t.time||''}"><div class="row"><button class="btn g wide" onclick="svTime('${id}',1)">알림 끄기</button><button class="btn wide" onclick="svTime('${id}')">저장</button></div>`}
 else if(v==='timer'){title='타이머';body=`<input id="sn" type="number" value="25" min="1"><div class="mu" style="font-size:12px">분 단위로 입력하세요</div><button class="btn wide" onclick="svTimer('${id}')">시작</button>`}
 else if(v==='date'){title='날짜 바꾸기';body=`<input id="sd" type="date" value="${t.date}"><button class="btn wide" onclick="svDate('${id}')">저장</button>`}
 else if(v==='about'){title='정보';body=`<div class="mu" style="line-height:1.9">카테고리: ${esc(D.cats.find(c=>c.id===t.cid)?.name||'')}<br>날짜: ${t.date}<br>상태: ${t.done?'완료':'진행 중'}<br>시간 알림: ${t.time||'없음'}<br>생성: ${new Date(t.ts).toLocaleString('ko-KR')}<br>메모: ${t.memo?esc(t.memo):'없음'}</div>`}
 document.getElementById('md').innerHTML=`<div class="mask sh" onclick="if(event.target===this)mclose()"><div class="sheet"><div class="grab"></div>${v==='main'?`<div class="b" style="text-align:center;font-size:15px">${esc(t.text)}</div>`:`<div class="row" style="margin-bottom:8px"><button onclick="sheet('${id}')">${ic('l')}</button><div class="b" style="flex:1;text-align:center;margin-right:20px">${title}</div></div>`}${body}</div></div>`;
 if(v!=='main')setTimeout(()=>document.querySelector('.sheet textarea,.sheet input')?.focus(),30)}
function svMemo(id){T(id).memo=document.getElementById('sm').value.trim();save();render();sheet(id)}
function svTime(id,off){const t=T(id);t.time=off?'':document.getElementById('st').value;t.fired='';save();render();if(t.time&&window.Notification&&Notification.permission==='default')Notification.requestPermission();sheet(id)}

setInterval(()=>{const n=new Date(),hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
 D.todos.forEach(t=>{if(t.time===hm&&t.date===TODAY&&!t.done&&t.fired!==hm){t.fired=hm;save();toast('알림: '+t.text);try{new Notification('Affinity Neo',{body:t.text})}catch(e){}}});

 if(S.timer){const s=Math.max(0,Math.ceil((S.timer.end-Date.now())/1000)),e=document.getElementById('tt');if(e)e.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(!s){toast('타이머 종료: '+S.timer.txt);S.timer=null;render()}}},1000);

function catForm(c){modal(c?'카테고리 수정':'카테고리 추가',[{p:'카테고리 이름',v:c?.name},{t:'col',v:c?.color},{t:'sel',v:c?.ended?1:0,o:[[0,'사용 중'],[1,'종료']]}],([name,color,e])=>{const d={name,color,priv:0,ended:+e};c?Object.assign(c,d):D.cats.push({id:uid(),...d});save()},c&&(()=>{D.cats=D.cats.filter(x=>x!==c)}))}
function routineDue(r,key){const d=new Date(key+'T00:00:00'),day=d.getDate(),dow=d.getDay(),last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),start=new Date((r.start||key)+'T00:00:00');if(d<start||(r.end&&key>r.end))return false;const diff=Math.floor((d-start)/86400000);switch(r.repeat||'weekly'){case'daily':return diff%(+r.interval||1)===0;case'weekly':return Math.floor(diff/7)%(+r.interval||1)===0&&(r.days||[]).includes(dow);case'monthly_nth':return (r.ordinal===0?day+7>last:Math.floor((day-1)/7)+1===(+r.ordinal||2))&&dow===(r.weekday===0?0:(+r.weekday||6));case'month_end':return day===last;case'monthly_date':return day===(+r.monthday||1);case'interval':return diff%(+r.interval||1)===0;default:return false}}

function routineExtra(r,type){const days=r?.days||[1,2,3,4,5];if(type==='weekly')return `<div class="row" style="justify-content:space-between">${'일월화수목금토'.split('').map((d,i)=>`<button class="rday ${days.includes(i)?'on':''}" onclick="this.classList.toggle('on')" data-day="${i}">${d}</button>`).join('')}</div><div class="rsmall">매주 선택한 요일 반복</div>`;if(type==='monthly_nth')return `<div class="row"><select id="rordinal" style="background:var(--bg)">${[[1,'첫째 주'],[2,'둘째 주'],[3,'셋째 주'],[4,'넷째 주'],[5,'다섯째 주'],[0,'마지막 주']].map(([v,n])=>`<option value="${v}" ${(r?.ordinal??2)===v?'selected':''}>${n}</option>`).join('')}</select><select id="rweekday" style="background:var(--bg)">${'일월화수목금토'.split('').map((d,i)=>`<option value="${i}" ${(r?.weekday??6)===i?'selected':''}>${d}요일</option>`).join('')}</select></div><div class="rsmall">예: 매달 둘째 주 토요일</div><div style="margin-top:10px"><label class="row"><input type="checkbox" id="rmonthend" style="width:auto" ${r?.repeat==='month_end'?'checked':''}>매달 마지막 날</label></div>`;if(type==='interval')return `<div class="row"><span>매</span><input id="rinterval" type="number" min="1" max="365" value="${r?.interval||2}" style="width:90px;background:var(--bg)"><span>일마다</span></div>`;if(type==='monthly_date')return `<div class="row"><span>매달</span><input id="rmonthday" type="number" min="1" max="31" value="${r?.monthday||1}" style="width:90px;background:var(--bg)"><span>일</span></div>`;return '<div class="rsmall">매일 반복합니다.</div>'}
function routineForm(r){const cats=D.cats.filter(c=>!c.ended),repeat=['month_end','monthly_date'].includes(r?.repeat)?'monthly_nth':r?.repeat||'weekly';window._routine={repeat,id:r?.id};document.getElementById('md').innerHTML=`<div class="mask" onclick="if(event.target===this)mclose()"><div class="mb" style="max-width:420px;max-height:92vh;overflow:auto;padding:20px"><div class="row sp" style="margin-bottom:18px"><button class="mu" onclick="mclose()">‹ 뒤로</button><div class="b" style="font-size:16px">반복하기</div><span style="width:42px"></span></div><input id="rn" placeholder="루틴 이름" value="${esc(r?.name||'')}" style="margin-bottom:12px;background:var(--bg)"><select id="rc" style="margin-bottom:12px">${cats.map(c=>`<option value="${c.id}" ${(r?.cid||cats[0]?.id)===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><div class="rpanel"><div class="b" style="margin-bottom:12px">반복</div><div class="rtab">${[['daily','매일'],['weekly','매주'],['monthly_nth','매달'],['interval','N일마다']].map(([k,n])=>`<button id="rt-${k}" class="${repeat===k?'on':''}" onclick="setRoutineType('${k}')">${n}</button>`).join('')}</div><div id="r-extra" style="margin-top:14px">${routineExtra(r,repeat)}</div></div><div class="rpanel"><div class="rrow"><span>시작일</span><input id="rstart" type="date" value="${r?.start||TODAY}" style="width:170px;padding:8px;background:var(--bg)"></div><div class="rrow"><span>종료일</span><input id="rend" type="date" value="${r?.end||''}" style="width:170px;padding:8px;background:var(--bg)"></div><div class="rrow"><span>시간 알림</span><input id="rtime" type="time" value="${r?.time||''}" style="width:130px;padding:8px;background:var(--bg)"></div></div><div class="rpanel"><textarea id="rmemo" placeholder="메모" style="min-height:70px;background:var(--bg)">${esc(r?.memo||'')}</textarea></div>${r?`<button class="btn g wide" style="margin-bottom:8px" onclick="deleteRoutine('${r.id}')">루틴 삭제</button>`:''}<button class="btn wide" onclick="saveRoutine('${r?.id||''}')">반복 시작</button></div></div>`}
function setRoutineType(type){window._routine={...(window._routine||{}),repeat:type};document.querySelectorAll('.rtab button').forEach(b=>b.classList.toggle('on',b.id==='rt-'+type));document.getElementById('r-extra').innerHTML=routineExtra(null,type)}
function saveRoutine(id){const name=document.getElementById('rn').value.trim();if(!name){toast('루틴 이름을 입력해 주세요');return}let type=window._routine?.repeat||'weekly';const days=[...document.querySelectorAll('[data-day].on')].map(e=>+e.dataset.day);if(type==='monthly_nth'&&document.getElementById('rmonthend')?.checked)type='month_end';const rid=id||uid(),d={id:rid,name,cid:document.getElementById('rc').value,repeat:type,days,ordinal:document.getElementById('rordinal')?+document.getElementById('rordinal').value:2,weekday:document.getElementById('rweekday')?+document.getElementById('rweekday').value:6,monthday:+(document.getElementById('rmonthday')?.value||1),interval:+(document.getElementById('rinterval')?.value||1),start:document.getElementById('rstart').value||TODAY,end:document.getElementById('rend').value,time:document.getElementById('rtime').value,memo:document.getElementById('rmemo').value};if(id){const old=D.rt.find(x=>x.id===id);if(old)Object.assign(old,d)}else D.rt.push(d);save();mclose();for(let i=0;i<370;i++){const dt=new Date(TODAY+'T00:00:00');dt.setDate(dt.getDate()+i);const k=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');if(routineDue(d,k)&&!D.todos.some(t=>t.rid===rid&&t.date===k)){D.todos.push({id:uid(),cid:d.cid,text:d.name,date:k,done:0,memo:d.memo||'',time:d.time||'',rid,ts:Date.now()})}}save();render()}

 return back(esc(c.name),'leaveCrew()')+`<div class="mu" style="margin-bottom:14px;line-height:1.6">${esc(c.desc)||'크루 소개가 없어요.'}</div>
 <div class="row" style="flex-wrap:wrap;margin-bottom:16px">${(c.members||[]).map(i=>`<div class="chip" style="padding:5px 12px 5px 5px"><div class="av" style="width:24px;height:24px;font-size:11px">${esc((US[i]?.name||'?')[0])}</div>${esc(US[i]?.name||'')}</div>`).join('')}</div>
 <div class="row" style="margin-bottom:20px"><button class="btn${mem?' g':''}" onclick="joinCrew('${c.id}',${mem})">${mem?'탈퇴하기':'가입하기'}</button>${c.owner===ME.uid?`<button class="btn g" onclick="delCrew('${c.id}')">크루 삭제</button>`:''}</div>
 ${mem?`<button class="btn g" style="margin:0 0 14px" onclick="joinCrew('${c.id}',false)">공유 카테고리 변경</button><div class="ttl">공유된 할 일</div>${shared.map(({t,u,cat,profile})=>`<div class="ti"><span class="ck" style="${t.done?'background:'+(cat?.color||'var(--acc)')+';border-color:'+(cat?.color||'var(--acc)'):''}">${t.done?ic('ck'):''}</span><div style="flex:1"><div class="row sp"><span>${esc(t.text)}</span><span class="mu" style="font-size:11px">${esc(profile?.name||'')} · ${esc(cat?.name||'')}</span></div><div class="sub">${t.date}${t.memo?' · '+esc(t.memo):''}</div></div></div>`).join('')||'<div class="mu" style="margin-bottom:16px">아직 공유된 할 일이 없어요. 공유할 카테고리를 선택해 주세요.</div>'}<textarea id="cp" placeholder="크루에 남길 이야기" style="min-height:70px"></textarea><div class="row" style="justify-content:flex-end;margin:8px 0 6px"><button class="btn" onclick="postCrew()">올리기</button></div>`:'<div class="mu">가입하면 공유할 카테고리를 선택할 수 있어요.</div>'}
 ${S.cposts.map(p=>{const l=(p.likes||[]).includes(ME.uid);return `<div class="post"><div class="row">${avt(US[p.uid])}<div><b>${esc(US[p.uid]?.name)}</b> <span class="mu">${ago(p.ts)}</span></div>${p.uid===ME.uid?`<button class="mu" style="margin-left:auto" onclick="db.collection('crewposts').doc('${p.id}').delete()">${ic('tr','width:16px')}</button>`:''}</div><div style="margin:8px 0 8px 42px;white-space:pre-wrap">${esc(p.text)}</div><button class="row" style="margin-left:42px;color:${l?'#e0476b':'var(--mu)'}" onclick="likeCp('${p.id}',${l})">${ic('hrt','width:18px;fill:'+(l?'#e0476b':'none'))}${(p.likes||[]).length}</button></div>`}).join('')}`}
function vExplore(){if(S.crew)return vCrew();let ps=[];[ME.uid,...D.follows].forEach(i=>((i===ME.uid?D:US[i])?.posts||[]).forEach(p=>ps.push({...p,u:i})));ps.sort((a,b)=>b.ts-a.ts);
 return `<button class="row" style="width:100%;background:var(--pill);border-radius:14px;padding:12px 14px;color:var(--mu)" onclick="S.sub='ppl';render()">${ic('ppl','width:16px')}계정 찾기</button>
 <div class="row sp" style="margin:26px 0 12px"><div class="b" style="font-size:17px">크루</div><div class="row"><button class="btn g" onclick="info('크루란?','관심사나 목표가 같은 사람들이 모여 서로의 이야기를 나누고 응원하는 공간이에요. 크루에 가입하면 글을 올리고 좋아요로 응원할 수 있어요.')">크루란?</button><button class="btn" onclick="modal('크루 만들기',[{p:'크루 이름'},{t:'area',p:'크루 소개'}],([name,desc])=>db.collection('crews').add({name,desc,owner:ME.uid,members:[ME.uid],ts:Date.now()}))">만들기</button></div></div>
 <div class="row" style="overflow-x:auto;align-items:stretch;padding-bottom:6px">${S.crews.map(c=>{const mem=(c.members||[]).includes(ME.uid);return `<div class="crd" onclick="enterCrew('${c.id}')"><div class="b">${esc(c.name)}</div><div class="mu" style="font-size:12px">멤버 <b>${(c.members||[]).length}</b>${mem?' · 가입함':''}</div></div>`}).join('')||'<div class="mu">아직 크루가 없어요. 첫 크루를 만들어 보세요.</div>'}</div>
 <div class="b" style="font-size:17px;margin:28px 0 10px">친구 소식</div>`+(ps.map(p=>`<div class="post"><div class="row sp"><span><b>${esc((p.u===ME.uid?D:US[p.u])?.name)}</b> <span class="mu">${ago(p.ts)}</span></span>${p.u===ME.uid?`<button class="mu" onclick="D.posts=D.posts.filter(x=>x.id!='${p.id}');save();render()">${ic('tr','width:16px')}</button>`:''}</div><div style="margin-top:6px;white-space:pre-wrap">${esc(p.text)}</div></div>`).join('')||'<div class="mu">아직 친구 소식이 없어요.</div>')}
function vNoti(){let it=[];D.follows.forEach(i=>(US[i]?.log||[]).forEach(a=>it.push({...a,u:i})));it.sort((a,b)=>b.ts-a.ts);
 return `<div class="ttl">알림</div>`+(it.slice(0,40).map(a=>`<div class="row" style="padding:10px 0">${avt(US[a.u])}<div><div><b>${esc(US[a.u]?.name)}</b>님이 할 일을 완료했어요</div><div>${esc(a.text)}</div><div class="mu" style="font-size:12px">${ago(a.ts)}</div></div></div>`).join('')||'<div class="mu">친구를 팔로우하면 완료 소식이 여기에 표시돼요.</div>')}
function vMe(){return `<div class="row" style="justify-content:flex-end"><button onclick="S.sub='set';render()">${ic('gear')}</button></div>
 <div class="row" style="margin-bottom:20px">${avt(D,1)}<div><div class="b" style="font-size:17px">${esc(D.name)}</div><div class="mu">${esc(ME.email)}</div><div>팔로잉 <b>${D.follows.length}</b> &nbsp;팔로워 <b>${Object.values(US).filter(x=>(x.follows||[]).includes(ME.uid)).length}</b></div></div></div>
 <div class="row" style="background:var(--card);border-radius:18px;padding:22px 0">${[['bar','나의 기록','rec'],['coin','테마 상점','shop'],['box','보관함','arch']].map(([i,t,k])=>`<button style="flex:1;display:grid;justify-items:center;gap:8px;font-weight:700;font-size:12px" onclick="S.sub='${k}';render()">${ic(i)}${t}</button>`).join('')}</div>`}

/* ---------- 로그인 / 렌더 ---------- */
const vAuth=()=>`<div class="auth"><div class="b" style="font-size:24px">Affinity Neo</div><input id="em" type="email" placeholder="이메일"><input id="pw" type="password" placeholder="비밀번호 (6자 이상)"><input id="nm" placeholder="이름 (회원가입 시)"><div style="color:#e5484d;font-size:12px">${esc(S.err)}</div><button class="btn wide" onclick="login()">로그인</button><button class="btn g wide" onclick="signup()">회원가입</button></div>`;
const fail=e=>{S.err=e.code=='auth/invalid-credential'?'이메일 또는 비밀번호를 확인해 주세요.':e.code=='auth/email-already-in-use'?'이미 가입된 이메일입니다.':e.code=='auth/weak-password'?'비밀번호는 6자 이상이어야 해요.':e.code=='auth/operation-not-allowed'?'Firebase에서 이메일/비밀번호 로그인을 켜 주세요.':'오류: '+e.code;render()};
const login=()=>auth.signInWithEmailAndPassword(em.value.trim(),pw.value).catch(fail);
const signup=()=>{const n=nm.value.trim();auth.createUserWithEmailAndPassword(em.value.trim(),pw.value).then(r=>{D=def();D.name=n||em.value.split('@')[0];ME=r.user;db.collection('users').doc(r.user.uid).set(D)}).catch(fail)};
auth.onAuthStateChanged(u=>{U.forEach(f=>f());U=[];UC();UC=()=>{};ME=u;S.ready=0;S.view=null;S.sub=null;S.crew=null;S.add=null;S.edit=null;
 if(!u){D=def();lastLocalCoins=0;lastLocalCompleteCoins=0;pendingCoinDelta=0;pendingCompleteDelta=0;return render()}
 U.push(db.collection('users').doc(u.uid).onSnapshot(s=>{ensureCoinMaintenance(u.uid);if(dirty)return;if(s.exists){const cloudData=s.data();D=Object.assign(def(),cloudData);D.coins=Number(cloudData.coins!=null?cloudData.coins:(cloudData.gc||0));D.completeCoins=Number(cloudData.completeCoins!=null?cloudData.completeCoins:(cloudData.sc||0));lastLocalCoins=D.coins;lastLocalCompleteCoins=D.completeCoins;if(D.todoCoinResetV1!==true){D.todoCoinResetV1=true;db.collection('users').doc(u.uid).set({todoCoinResetV1:true},{merge:true}).catch(()=>{})}if(u.email&&D.email!==u.email){D.email=u.email;db.collection('users').doc(u.uid).set({email:u.email},{merge:true}).catch(()=>{})}if((u.email||'').toLowerCase().startsWith('affinityuniverse.neo@')&&(!D.name||D.name==='affinityuniverse.neo'||D.name==='affinityuniverse')){D.name='선혜';db.collection('users').doc(u.uid).set({name:'선혜'},{merge:true}).catch(()=>{})}}else{D=def();D.name=(u.email||'').toLowerCase().startsWith('affinityuniverse.neo@')?'선혜':(u.displayName||u.email.split('@')[0]);D.email=u.email||'';D.todoCoinResetV1=true;db.collection('users').doc(u.uid).set(D)}S.ready=1;genRoutine();render()},e=>{S.err='데이터베이스 오류: '+e.code;S.ready=1;render()}));
 U.push(db.collection('users').onSnapshot(s=>{US={};s.docs.forEach(d=>US[d.id]=d.data());render()}));
 U.push(db.collection('crews').onSnapshot(s=>{S.crews=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0));render()}))});
function render(){D.cats=(D.cats||[]).map(c=>({...c,priv:0}));D.rewards=D.rewards||[];D.badges=D.badges||[];document.documentElement.dataset.t=D.theme;const app=document.getElementById('app');
 const keep={};app.querySelectorAll('input[id],textarea[id]').forEach(i=>keep[i.id]=[i.value,i===document.activeElement]);
 const rest=()=>{Object.entries(keep).forEach(([k,[v,f]])=>{const e=document.getElementById(k);if(e){e.value=v;if(f){e.focus();e.setSelectionRange?.(v.length,v.length)}}});
  if(!keep.ai){const a=document.getElementById('ai');if(a)a.focus()}if(!keep.ei){const a=document.getElementById('ei');if(a){a.focus();a.select()}}};
 if(!ME){app.innerHTML=vAuth();return rest()}
 if(!S.ready){app.innerHTML='<div class="w mu">불러오는 중…</div>';return}
 const b=S.sub?vSub():{home:vHome,explore:vExplore,noti:vNoti,me:vMe}[S.tab]();
 const nav=[['home','home'],['explore','compass'],['noti','bell'],['me','user']];
 app.innerHTML=`<div class="w">${b}${S.err?`<div style="margin-top:12px;color:#e5484d">${esc(S.err)}</div>`:''}</div><div class="nav">${nav.map(([k,i])=>`<button class="${S.tab===k?'on':''}" onclick="go('${k}')">${ic(i,'width:24px;height:24px')}</button>`).join('')}</div>`;rest()}
</script></body></html>
