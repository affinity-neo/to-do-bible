<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>오늘의 잠언 · 나무 상점</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root { --bg:#f7f4ee; --fg:#27302c; --muted:#78837d; --accent:#3d6b5b; --line:#e5e0d3; --hl:#e3eee7;
    --card:color-mix(in srgb,var(--bg),white 55%);
    --ff:'Gowun Batang','Noto Serif KR',serif; --ui:'Gowun Dodum','Noto Sans KR',system-ui,sans-serif; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161b19; --fg:#e5ebe7; --muted:#8f9a94; --accent:#8cc4ad; --line:#2a3330; --hl:#22342d;
      --card:color-mix(in srgb,var(--bg),white 7%); }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font-family:var(--ff); line-height:1.95;
    -webkit-text-size-adjust:100%; }
  main { max-width:640px; margin:0 auto; padding:28px 20px 140px; }
  header { text-align:center; margin-bottom:18px; }
  .date { color:var(--muted); font-size:.9rem; font-family:var(--ui); }
  h1 { margin:.2em 0 0; font-size:1.8rem; color:var(--accent); }

  .player { position:sticky; top:0; background:var(--bg); padding:12px 0 10px;
    border-bottom:1px solid var(--line); margin-bottom:22px; z-index:2;
    font-family:var(--ui); }
  .row { display:flex; align-items:center; gap:10px; }
  .row button { border:1px solid var(--line); background:transparent; color:var(--fg);
    width:38px; height:38px; border-radius:50%; cursor:pointer; font-size:.8rem; flex:none; }
  .row #play { width:46px; height:46px; background:var(--accent); color:var(--bg);
    border-color:var(--accent); font-size:1rem; }
  #seek { flex:1; min-width:0; accent-color:var(--accent); }
  #time { color:var(--muted); font-size:.78rem; min-width:80px; text-align:right; font-variant-numeric:tabular-nums; }
  .speed { display:flex; gap:6px; justify-content:center; margin-top:10px; flex-wrap:wrap; }
  .speed button { border:1px solid var(--line); background:transparent; color:var(--fg);
    padding:4px 11px; border-radius:999px; cursor:pointer; font-size:.82rem; }
  .speed button.on { background:var(--accent); color:var(--bg); border-color:var(--accent); }
  .note { color:var(--muted); font-size:.85rem; text-align:center; margin:8px 0 0; }

  .verse { margin:0 0 .35em; padding:.3em .6em; font-size:1.1rem; border-radius:8px;
    cursor:pointer; transition:background .25s; }
  .verse sup { color:var(--accent); font-size:.7rem; margin-right:6px; font-family:var(--ui); }
  .verse.on { background:var(--hl); }

  .game { margin-top:40px; font-family:var(--ui); }
  .game .lock { text-align:center; color:var(--muted); font-size:.88rem; margin:0; }
  .game h2 { margin:0 0 4px; text-align:center; color:var(--accent); font-family:inherit; font-size:1.2rem; }
  .game .sub { text-align:center; color:var(--muted); font-size:.86rem; margin:0 0 14px; line-height:1.6; }
  .game canvas.gcv { display:block; width:100%; max-width:420px; margin:0 auto; aspect-ratio:360/520;
    border-radius:16px; border:1px solid var(--line); touch-action:manipulation; cursor:pointer;
    -webkit-tap-highlight-color:transparent; outline:none; background:#cfe6f7; }
  .game .gobox { text-align:center; margin-top:14px; }
  .game .gotitle { font-size:1.05rem; color:var(--accent); font-weight:700; }
  .game .godesc { color:var(--muted); font-size:.86rem; margin:6px 0 0; line-height:1.6; }
  .game .go { display:inline-block; margin-top:12px; padding:11px 24px; border-radius:999px; border:0;
    background:var(--accent); color:var(--bg); font-size:.95rem; cursor:pointer; }
  .game .stage { max-width:420px; margin:0 auto; }
  .game .dm-top { display:flex; justify-content:space-between; font-weight:700; color:var(--accent); margin-bottom:6px; }
  .game .dm-bar { height:10px; border-radius:6px; background:var(--line); overflow:hidden; }
  .game .dm-bar i { display:block; height:100%; width:100%; background:linear-gradient(90deg,#5aa9e6,#8bd0f5); }
  .game .dm-msg { min-height:1.6em; text-align:center; font-size:.9rem; margin:10px 0; }
  .game .crowd { height:112px; min-height:112px; overflow:hidden; display:flex; flex-wrap:wrap; gap:1px; justify-content:center; align-content:flex-start; margin:6px 0 8px; }
  .loaves-stage{display:flex;flex-direction:column}
  .loaves-hype{height:26px;min-height:26px;text-align:center;font-size:.86rem;font-weight:700;color:var(--accent);margin:0 0 4px}
  .game .bread{flex:none;transition:transform .08s,filter .15s}
  .game .bread.boost{filter:saturate(1.25);box-shadow:0 0 0 5px rgba(255,190,64,.25),0 6px 0 #b86f1f,0 12px 20px rgba(0,0,0,.18)}
  .race-progress,.race-power{display:flex;align-items:center;gap:8px;margin:6px 0 10px;font-size:.78rem;font-weight:700;color:var(--accent)}
  .race-guide{display:flex;flex-direction:column;gap:3px;padding:9px 11px;margin:8px 0;border-radius:12px;background:var(--hl);font-size:.78rem;line-height:1.4;color:var(--fg)}\n  .race-guide strong{color:var(--accent);font-size:.84rem}
  .race-progress i,.race-power i{display:block;flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .race-progress b,.race-power b{display:block;width:0;height:100%;background:linear-gradient(90deg,#e9ba54,#f08b46);border-radius:99px;transition:width .12s linear}
  .race-power b{background:linear-gradient(90deg,#65c6e8,#8aebc0)}
  .race-controls{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px;margin-top:12px}
  .race-controls button{min-height:54px;border:1px solid var(--line);border-radius:16px;background:var(--hl);color:var(--fg);font-size:1rem;font-weight:800;touch-action:manipulation;user-select:none;-webkit-user-select:none}
  .race-controls button:active{transform:scale(.97);background:var(--accent);color:var(--bg)}
  .shared-mission{margin:12px 0 0;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:left;font-size:.86rem;line-height:1.65}
  .shared-mission strong{color:var(--accent)}
  .shared-mission .sm-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .shared-mission .sm-tag{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--hl);font-weight:700}

  .game .pop { animation:pop .25s ease-out; }
  @keyframes pop { from { transform:scale(.3); opacity:0; } to { transform:scale(1); opacity:1; } }
  .game .bread { display:block; margin:6px auto 0; width:170px; height:170px; border-radius:50%; border:0; cursor:pointer;
    background:radial-gradient(circle at 35% 30%, #ffd98a, #e39a3b 70%); color:#5a3410; font-size:1.7rem; font-weight:800;
    box-shadow:0 6px 0 #b86f1f, 0 12px 20px rgba(0,0,0,.18); user-select:none; -webkit-user-select:none;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent; font-family:inherit; }
  .game .bread:active { transform:translateY(4px); box-shadow:0 2px 0 #b86f1f; }
  .game .bread small { display:block; font-size:.8rem; font-weight:600; }
  .game .mgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .game .mc { aspect-ratio:1/1.05; perspective:600px; border:0; background:transparent; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .game .mc .in { position:relative; display:block; width:100%; height:100%; transition:transform .35s; transform-style:preserve-3d; }
  .game .mc.open .in, .game .mc.done .in { transform:rotateY(180deg); }
  .game .mc .f, .game .mc .b { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:12px; display:flex; align-items:center; justify-content:center; }
  .game .mc .f { background:var(--accent); color:var(--bg); font-size:1.5rem; font-weight:800; }
  .game .mc .b { transform:rotateY(180deg); background:var(--hl); border:2px solid var(--line); }
  .game .mc.done .b { border-color:#7aa56a; }
  .game .wface { text-align:center; margin:8px 0; min-height:70px; }
  .game .wtxt { font-size:1rem; line-height:1.7; margin:6px 0 12px; }
  .game .wopts { display:grid; gap:8px; }
  .game .wopts button { text-align:left; padding:12px 14px; border-radius:12px; border:1px solid var(--line);
    background:transparent; color:var(--fg); font-size:.93rem; font-family:inherit; cursor:pointer; line-height:1.5; }
  .game .wopts button.ok { background:#dcebd3; border-color:#7aa56a; color:#26421c; }
  .game .wopts button.mid { background:#fbf0cf; border-color:#d9b64a; color:#5a4410; }
  .game .wopts button.no { background:#f3d9d6; border-color:#c27b72; color:#5b241e; }
  .game .wr { margin:14px 0 4px; font-size:.95rem; line-height:1.6; }
  .game .wref { margin:0; font-size:.8rem; color:var(--muted); line-height:1.5; }
  .game .stage .go { display:block; margin:12px auto 0; }
  .game .pcs { display:grid; gap:10px; }
  .game .pc { border-radius:14px; border:2px solid var(--line); padding:14px; min-height:84px; background:var(--accent); color:var(--bg);
    cursor:pointer; text-align:left; font-family:inherit; display:block; width:100%; position:relative; -webkit-tap-highlight-color:transparent; }
  .game .pc .pq { display:block; text-align:center; font-size:1.8rem; font-weight:800; }
  .game .pc.open { background:var(--bg); color:var(--fg); cursor:default; animation:pop .3s ease-out; }
  .game .pc.other { opacity:.55; }
  .game .pc .prar { display:inline-block; font-size:.75rem; font-weight:800; padding:2px 8px; border-radius:999px; background:var(--line); }
  .game .pc .pf { float:right; margin-left:8px; }
  .game .pc .pv { display:block; font-family:var(--ff); font-size:.95rem; line-height:1.8; margin-top:6px; }
  .game .pc .pv sup { color:var(--accent); font-family:var(--ui); margin-right:5px; font-size:.7rem; }
  .game .pc.r1 { border-color:#4f8fd6; box-shadow:0 0 12px rgba(79,143,214,.45); }
  .game .pc.r1 .prar { background:#4f8fd6; color:#fff; }
  .game .pc.r2 { border-color:#e0b020; box-shadow:0 0 16px rgba(224,176,32,.7); background:linear-gradient(135deg,var(--bg),var(--hl)); }
  .game .pc.r2 .prar { background:#e0b020; color:#3a2a00; }
  .game .pc.mine { outline:3px solid var(--accent); outline-offset:2px; opacity:1; }

  .chnav { display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin-top:36px; padding-top:18px; border-top:1px solid var(--line);
    font-family:var(--ui); }
  .chnav a { display:inline-flex; align-items:center; gap:8px; padding:12px 18px; border-radius:999px;
    border:1px solid var(--line); color:var(--fg); text-decoration:none; font-size:.95rem; cursor:pointer;
    -webkit-tap-highlight-color:transparent; }
  .chnav a:active { background:var(--hl); }
  .chnav a.off { visibility:hidden; }
  .chnav #chToday { background:var(--accent); color:var(--bg); border-color:var(--accent); font-size:.85rem; padding:10px 16px; }
  .chnav a[hidden] { display:none; }

  /* 소리만 사용하는 유튜브 플레이어: 화면 밖에 둠 */
  #yt { position:absolute; left:-9999px; width:200px; height:200px; }

  /* 구절 시간 기록 도구 (주소 뒤에 ?record=1) */
  #rec { margin-top:12px; padding:10px; border:1px dashed var(--accent); border-radius:10px;
    font-family:var(--ui); font-size:.85rem; }
  #rec button { padding:8px 14px; border-radius:8px; border:0; background:var(--accent);
    color:var(--bg); cursor:pointer; font-size:.9rem; margin-right:6px; }
  #rec button.sub { background:transparent; color:var(--fg); border:1px solid var(--line); }
  #rec textarea { width:100%; height:110px; margin-top:8px; background:var(--bg); color:var(--fg);
    border:1px solid var(--line); border-radius:6px; font-size:.8rem; }

  .game .jgrid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .game .jg { aspect-ratio:1; border:3px solid var(--line); border-radius:20px; cursor:pointer; transition:transform .08s, filter .08s; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  .game .jg.lit { filter:brightness(1.3) saturate(1.3); transform:scale(.94); border-color:var(--accent); box-shadow:0 0 0 4px var(--accent); }

  .svg-ic, svg.ic { width:1.1em; height:1.1em; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  svg.fi { width:1em; height:1em; fill:currentColor; flex:none; }
  [data-ic] { display:inline-flex; align-items:center; }
  .game .lock { font-size:.86rem; }
  .game .ghead { display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:12px; }
  .game .ghead h2 { margin:0; font-size:1.2rem; }
  .ibtn { width:28px; height:28px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--muted); display:grid; place-items:center; cursor:pointer; padding:0; }
  .ibtn svg { width:15px; height:15px; }
  .game .sub { max-width:420px; margin:0 auto 14px; padding:10px 14px; background:var(--card); border:1px solid var(--line); border-radius:12px; text-align:left; }
  .game .sub[hidden] { display:none; }
  .game .bread { background:radial-gradient(circle at 35% 30%, #f7dca8, #dca457 72%); box-shadow:0 6px 0 #b98440, 0 12px 20px rgba(0,0,0,.14); }
  .game .bread:active { box-shadow:0 2px 0 #b98440; }
  .row button svg { width:18px; height:18px; }
  .row #play svg { width:20px; height:20px; }
  .chnav a svg { width:16px; height:16px; }
  .me { margin-top:40px; text-align:center; font-family:var(--ui); }
  .shopbtn { display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 22px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--accent); font-family:var(--ui); font-size:.95rem; font-weight:700; cursor:pointer; transition:background .2s,border-color .2s; }
  .shopbtn:hover { background:var(--hl); border-color:var(--accent); }
  .shopbtn:active { transform:translateY(1px); }
  .shopbtn svg { width:18px; height:18px; }
  #gameBox { --bg:#f8f1e2; --fg:#43362a; --muted:#8a7864; --accent:#4f6f5c; --line:#e2d5bd; --hl:#efe5cc; --card:#fffaf0;
    color:var(--fg); border:10px solid transparent; border-radius:22px; padding:14px 12px 16px;
    background:linear-gradient(var(--bg),var(--bg)) padding-box,repeating-linear-gradient(91deg,rgba(0,0,0,.055) 0 1px,transparent 1px 9px) border-box,linear-gradient(180deg,#9a7352,#6a4c36) border-box;
    box-shadow:0 0 0 1px #4d3626,0 12px 26px rgba(60,40,20,.2); }
  #toast { position:fixed; left:50%; bottom:max(24px,env(safe-area-inset-bottom)); transform:translate(-50%,16px); max-width:88vw; padding:11px 18px; border-radius:14px; background:#26302b; color:#f3f6f4; font:.9rem/1.5 var(--ui); opacity:0; pointer-events:none; transition:.25s; z-index:200; text-align:center; }
  #toast.show { opacity:1; transform:translate(-50%,0); }
  .shop-ov { position:fixed; inset:0; z-index:100; background:radial-gradient(80% 60% at 50% 30%,rgba(120,80,40,.5),rgba(18,10,5,.85)); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center;
    padding:max(14px,env(safe-area-inset-top)) 10px max(12px,env(safe-area-inset-bottom)); font-family:'Gowun Dodum','Noto Sans KR',sans-serif; color-scheme:dark; }
  .shop-ov[hidden] { display:none; }
  @keyframes shopIn { from { transform:translateY(18px) scale(.96); opacity:0; } }
  .shop-win { position:relative; width:100%; max-width:520px; height:min(780px,100%); display:flex; flex-direction:column; border-radius:26px; overflow:hidden; color:#fff2d6;
    background:radial-gradient(90% 38% at 50% 0%,rgba(255,200,120,.28),transparent 70%),radial-gradient(70% 30% at 100% 100%,rgba(120,190,110,.14),transparent 70%),
      repeating-linear-gradient(90deg,rgba(0,0,0,.09) 0 1px,transparent 1px 11px),repeating-linear-gradient(90deg,rgba(255,220,160,.045) 0 3px,transparent 3px 23px),
      repeating-linear-gradient(180deg,transparent 0 118px,rgba(20,10,4,.55) 118px 121px,rgba(255,220,160,.12) 121px 123px),
      linear-gradient(180deg,#6e4a2e,#573823 55%,#432a19);
    box-shadow:0 0 0 2px #2a1709,0 0 0 4px rgba(240,196,110,.55),0 0 0 7px rgba(240,196,110,.08),0 30px 70px rgba(10,5,2,.7),inset 0 0 0 2px rgba(255,225,170,.18),inset 0 0 60px rgba(20,10,4,.35); animation:shopIn .24s ease-out; }
  .shop-top { flex:none; position:relative; display:flex; align-items:center; justify-content:center; padding:18px 56px 10px; }
  .shop-sign { position:relative; display:flex; align-items:center; padding:9px 32px; border-radius:14px; border:1px solid #2f1b0c;
    background:repeating-linear-gradient(90deg,rgba(80,45,15,.14) 0 2px,transparent 2px 10px),linear-gradient(180deg,#e2b073,#c48c50 55%,#a8733b);
    box-shadow:0 4px 0 #2f1b0c,0 10px 18px rgba(10,5,2,.4),inset 0 1px 0 rgba(255,240,200,.65),inset 0 -2px 0 rgba(70,35,10,.25); }
  .shop-sign::before,.shop-sign::after { content:''; position:absolute; top:50%; width:8px; height:8px; margin-top:-4px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#fff1c4,#a67a2c 70%); box-shadow:0 1px 1px rgba(30,15,5,.6); }
  .shop-sign::before { left:11px; } .shop-sign::after { right:11px; }
  .shop-title { display:flex; align-items:center; gap:9px; font-family:'Noto Sans KR','Gowun Dodum',sans-serif; font-weight:800; font-size:1.3rem; letter-spacing:.03em; color:#fff6dc; text-shadow:0 2px 0 #6a4220,0 0 10px rgba(255,220,150,.4); }
  .shop-title svg { width:22px; height:22px; color:#fff1c4; }
  .shop-x { position:absolute; right:14px; top:16px; width:36px; height:36px; border-radius:50%; border:1px solid #2f1b0c; color:#fff0cc;
    background:linear-gradient(#8c6240,#5e3f27); display:grid; place-items:center; padding:0; cursor:pointer; box-shadow:0 3px 0 #2f1b0c,inset 0 1px 0 rgba(255,235,190,.4); transition:transform .12s; }
  .shop-x:hover { filter:brightness(1.12); } .shop-x:active { transform:translateY(2px); box-shadow:0 1px 0 #2f1b0c; }
  .shop-x svg { width:16px; height:16px; }
  .shop-in { flex:1; min-height:0; display:flex; flex-direction:column; }
  .shop-acct { flex:none; padding:4px 14px 8px; font-size:.88rem; line-height:1.6; color:#f4e3c0; }
  .acrow { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px; }
  .acrow + .acrow { margin-top:8px; }
  .chip { display:inline-flex; align-items:center; gap:7px; padding:6px 14px; border-radius:999px; background:rgba(25,12,4,.45); border:1px solid rgba(240,196,110,.45); color:#fff2d6; font-size:.86rem; box-shadow:inset 0 2px 4px rgba(0,0,0,.3),0 1px 0 rgba(255,225,170,.18); }
  .chip svg { width:16px; height:16px; color:#ffd36b; }
  .chip b { color:#ffe08a; font-variant-numeric:tabular-nums; }
  .grow { display:none; }
  .lnk { border:0; background:none; color:#ffd77a; font:inherit; font-weight:700; text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:4px; text-shadow:0 1px 2px rgba(20,10,4,.6); }
  .acnote { display:none; }
  .acform { display:flex; gap:6px; width:100%; }
  .acform input { flex:1; min-width:0; padding:9px 14px; border-radius:12px; border:1px solid rgba(240,196,110,.5); background:rgba(25,12,4,.5); font:inherit; color:#fff6e0; outline:none; box-shadow:inset 0 2px 4px rgba(0,0,0,.35); }

  /* ---- 성취감: 등급 · 프로필 · 수집 · 축하 · 업적 ---- */
  .sc .rb { position:absolute; top:8px; left:8px; z-index:1; padding:1px 7px; border-radius:999px; font-size:.62rem; font-weight:800; color:#fff; background:#8a948d; box-shadow:0 1px 0 rgba(0,0,0,.25); }
  .sc.r-rare .rb { background:#3b82f6; } .sc.r-epic .rb { background:#a855f7; } .sc.r-leg .rb { background:linear-gradient(90deg,#f59e0b,#ef4444); }
  .sc.r-rare { border-color:#9bbcf2; } .sc.r-epic { border-color:#cfa5f5; } .sc.r-leg { border-color:#f0b43a; animation:legGlow 2.4s ease-in-out infinite; }

  .prof { display:flex; align-items:center; gap:10px; width:100%; padding:7px 12px; border-radius:16px; background:rgba(25,12,4,.45); border:1px solid rgba(240,196,110,.45); box-shadow:inset 0 2px 4px rgba(0,0,0,.3); text-align:left; }

  /* Responsive layout and reliable touch controls */
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  button,input{font:inherit}button{touch-action:manipulation}
  .player .row{display:grid;grid-template-columns:44px 50px 44px minmax(40px,1fr);align-items:center;justify-content:center;gap:8px;width:100%}
  .player .row #time{grid-column:1/-1;justify-self:center;min-width:0;text-align:center;margin-top:2px}
  .player .row button{display:grid;place-items:center;padding:0;margin:0}
  .player .row #play{justify-self:center}
  .player .row #seek{width:100%;min-width:0;margin:0}
  .game .go,.game button,.ibtn{-webkit-appearance:none;appearance:none}
  .game .go{min-height:46px;display:inline-flex;align-items:center;justify-content:center;text-align:center}
  .game .stage,#gameArea{width:100%;min-width:0}
  .game canvas.gcv{width:100%;height:auto;max-width:420px;aspect-ratio:360/520;touch-action:none;user-select:none;-webkit-user-select:none}
  #gameBox,#gameArea{min-width:0}
  .game .bread{max-width:72vw;max-height:72vw}
  .race-wrap{max-width:420px;margin:0 auto}
  .race-hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:0 0 8px;font-weight:700;color:var(--accent)}
  .race-canvas{display:block;width:100%;height:auto;aspect-ratio:360/520;border-radius:16px;border:1px solid var(--line);background:#d9e7c6;touch-action:none}
  .race-controls{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px;margin-top:12px}
  .race-controls button{min-height:54px;border:1px solid var(--line);border-radius:16px;background:var(--hl);color:var(--fg);font-size:1rem;font-weight:800;touch-action:manipulation;user-select:none;-webkit-user-select:none}
  .race-controls button:active{transform:scale(.97);background:var(--accent);color:var(--bg)}
  .race-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:10px}
  .race-actions button{min-height:44px;padding:9px 18px;border:0;border-radius:999px;background:var(--accent);color:var(--bg);font-weight:700}
  @media(max-width:480px){main{padding:16px 12px calc(100px + env(safe-area-inset-bottom))}h1{font-size:1.55rem}.player{padding:9px 0}.player .row{grid-template-columns:42px 48px 42px minmax(30px,1fr);gap:6px}.player .row button{width:40px;height:40px}.player .row #play{width:46px;height:46px}.verse{padding:.35em .45em;font-size:1rem}.game{margin-top:28px}.game .bread{width:min(170px,62vw);height:min(170px,62vw)}.game .mgrid{gap:6px}.game .crowd{min-height:100px}.chnav{gap:6px}.chnav a{padding:10px 12px;font-size:.85rem}.race-controls button{min-height:64px}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}


  .fm-shell{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:5px;font-family:var(--ui);line-height:1.2}
  .fm-status{display:flex;justify-content:space-between;gap:5px;font-size:.72rem;color:var(--accent);padding:0 2px}
  .fm-timebar{height:5px;border-radius:10px;background:var(--line);overflow:hidden}.fm-timebar i{display:block;height:100%;width:100%;background:var(--accent);transition:width .2s}
  .fm-workbench{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .fm-panel{min-width:0;border:1px solid var(--line);border-radius:12px;padding:7px 5px;background:var(--card);text-align:center;overflow:hidden}
  .fm-order{background:linear-gradient(155deg,#fff2dd,var(--card));border-color:#d7b68d}
  .fm-build{background:linear-gradient(155deg,#edf7ed,var(--card));border-color:#acd0b3}
  .fm-panel-title{display:flex;align-items:center;justify-content:flex-start;gap:5px;text-align:left;min-height:30px;margin-bottom:1px}

  function recordSharedChallenge(gameId, metric) {

    var labels = { racing: '260점', manna: '45점', loaves: '2,500명' };
    var rivals = names[gameId] || ['요셉','에스더','다윗','룻'], target = targets[gameId] == null ? 0 : targets[gameId], targetLabel = labels[gameId] || '한 판 완료';
    var today = dayStr(), yesterday = dayStr(new Date(Date.now()-86400000)), meta = {}, daily = {};
    try { meta = JSON.parse(lsGet('neoGameMeta','{}')) || {}; } catch(e) { meta = {}; }
    try { daily = JSON.parse(lsGet('neoGameDaily','{}')) || {}; } catch(e) { daily = {}; }
    var plays = daily.day === today ? (daily.plays || 0) + 1 : 1;
    var done = daily.day === today && daily.done || {};
    var bests = meta.bests || {}, oldBest = Number(bests[gameId] || 0), newBest = metric > oldBest;
    if (newBest) bests[gameId] = metric;
    var complete = metric >= target, reward = complete && !(done[gameId]);
    if (complete) done[gameId] = true;
    var streak = meta.lastDay === today ? (meta.streak || 1) : meta.lastDay === yesterday ? (meta.streak || 0) + 1 : 1;
    meta.lastDay = today; meta.streak = streak; meta.bests = bests;
    daily = { day: today, plays: plays, done: done };
    lsSet('neoGameMeta', JSON.stringify(meta)); lsSet('neoGameDaily', JSON.stringify(daily));
    var rival = rivals[(new Date().getDate() + gameId.length) % rivals.length];
    var bestLabel = (bests[gameId] || 0).toLocaleString() + (gameId === 'loaves' ? '명' : '점');
    var badge = complete ? (gameId === 'racing' ? '광야 질주자' : gameId === 'manna' ? '생존 전문가' : '나눔의 기적') : plays >= 3 ? '끈기의 도전자' : '도전의 첫걸음';

      var positions=[[28,27],[48,23],[68,28],[22,44],[40,43],[59,42],[78,46],[29,61],[49,59],[68,62],[40,76],[59,77],[18,33],[81,31],[25,74],[75,75],[47,32],[76,57]];
      function pizzaSVG(shape,sauce,items,key){
        var s=shapeMap[shape], sc=sauceMap[sauce].c, clip=uidSafe(uid+key);

        out+='<path d="'+d+'" transform="translate(50 50) scale('+inner+') translate(-50 -50)" fill="'+sc+'" stroke="#f3d59b" stroke-width="1.5"/>';
        out+='<g clip-path="url(#'+clip+')">';
        var coords=positions.slice();

        }

        var count=visibleItems.length>=4?3:visibleItems.length===3?4:5;
        var totalPieces=visibleItems.length*count;
        visibleItems.forEach(function(id,idx){
          for(var n=0;n<count;n++){

            var p=coords[pi],sc=id==='olive'?1.18:1.58;
            out+='<g transform="translate('+p[0]+' '+p[1]+') scale('+sc+') translate('+(-p[0])+' '+(-p[1])+')">'+toppingSVG(id,p[0],p[1],(idx*47+n*31)%360)+'</g>';

    if(localStorage.getItem(key)==='done'){area.textContent='이 퀴즈는 이미 완료했어요.';return;}
    area.innerHTML='<p class="sub" style="line-height:1.8"></p><p style="font-weight:700;line-height:1.8;margin:12px 0"></p><div id="chapterQuizOptions" style="display:grid;gap:8px"></div><button id="chapterQuizSubmit" style="margin-top:14px;padding:11px 18px;border-radius:999px;background:var(--accent);color:var(--bg);font-weight:700">답안 확인</button><p id="chapterQuizResult" class="sub" aria-live="polite"></p>';
    area.children[0].textContent=item.context;
    area.children[1].textContent=item.q;
    var chosen='',list=area.querySelector('#chapterQuizOptions');
    item.opts.forEach(function(opt){var btn=document.createElement('button');btn.type='button';btn.textContent=opt;btn.style.cssText='padding:11px 13px;border:1px solid var(--line);border-radius:10px;text-align:left;background:var(--card);color:var(--fg)';btn.onclick=function(){chosen=opt;Array.prototype.forEach.call(list.children,function(x){x.style.outline='none'});btn.style.outline='2px solid var(--accent)'};list.appendChild(btn);});
    area.querySelector('#chapterQuizSubmit').onclick=function(){
      var out=area.querySelector('#chapterQuizResult');
      if(!chosen){out.textContent='답을 하나 선택해 주세요.';return;}
      if(chosen!==item.a){out.textContent='아쉬워요. 말씀을 다시 읽고 도전해 보세요.';return;}
      localStorage.setItem(key,'done');
      var earned=false;try{earned=day===today&&awardQuiz();}catch(e){}
      out.textContent=earned?'정답이에요! 말씀 코인 1개를 받았어요.':(day===today?'정답이에요! 오늘 퀴즈 보상은 이미 받았어요.':'정답이에요! 다른 날짜의 장이므로 말씀 코인은 지급되지 않아요.');
      area.querySelector('#chapterQuizSubmit').disabled=true;
    };
  })();
  if (new URLSearchParams(window.location.search).get('shop') === '1') {
    window.addEventListener('load', function () {
      setTimeout(function () {
        var ov = document.getElementById('shopOv');
        if (ov) {
          ov.hidden = false;
          document.body.style.overflow = 'hidden';
          openShop();
        }
      }, 350);
    });
  }
  window.addEventListener('pagehide', function () { if (api) api.pause(); });
})();
</script>
